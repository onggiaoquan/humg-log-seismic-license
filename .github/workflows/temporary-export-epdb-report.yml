name: temporary-export-epdb-report
on:
  push:
    paths:
      - ".github/workflows/temporary-export-epdb-report.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package report and screenshots
        run: |
          mkdir -p export
          cp Bao_cao_NCKH_AI_DQ_EPDB.docx export/
          cp dashboard_tongquan.JPG dashboard_QC_details.JPG dashboard_AI.JPG export/
          cd export
          zip -r ../epdb-report-source-files.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: epdb-report-source-files
          path: epdb-report-source-files.zip
          retention-days: 1
